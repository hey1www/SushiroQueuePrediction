services:
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: sushiro-hk-backend
    restart: unless-stopped
    env_file:
      - ../../backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ../../backend/data:/app/backend/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sushiro-hk-cloudflared
    restart: unless-stopped
    depends_on:
      - backend
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ../cloudflare/cloudflared-example.yml:/etc/cloudflared/config.yml:ro
      - ../cloudflare/your-tunnel-id.json:/etc/cloudflared/your-tunnel-id.json:ro
